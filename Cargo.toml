[workspace]
members = [
    "crates/plurifold-core",
    "crates/plurifold-protocol",
    "crates/plurifold-store",
    "crates/plurifold-scheduler",
    "crates/plurifold-runtime",
    "crates/plurifold-coordinator",
    "crates/plurifold-agent",
    "crates/plurifold-cli",
]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fwerkor/plurifold"
rust-version = "1.80"

[workspace.dependencies]
axum = "0.8"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
