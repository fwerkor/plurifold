syntax = "proto3";

package plurifold.v1;

// Transport-neutral design sketch. The v0.10 implementation uses HTTP/JSON DTOs
// from the plurifold-protocol crate; this file is not generated into the Rust build.
service Coordinator {
  rpc RegisterResource(RegisterResourceRequest) returns (MembershipLease);
  rpc Heartbeat(HeartbeatRequest) returns (MembershipLease);
  rpc LeaseWork(LeaseWorkRequest) returns (WorkLease);
  rpc RenewWork(RenewWorkRequest) returns (ExecutionLease);
  rpc CommitTask(CommitTaskRequest) returns (CommitTaskResponse);
  rpc ResolveObject(ResolveObjectRequest) returns (ResolveObjectResponse);
}

message ResourceDescriptor {
  string resource_id = 1;
  uint64 epoch = 2;
  string architecture = 3;
  uint32 cpu_cores = 4;
  uint64 memory_bytes = 5;
  repeated string capabilities = 6;
  double performance_score = 7;
  double failure_probability = 8;
}

message RegisterResourceRequest {
  ResourceDescriptor resource = 1;
  string data_endpoint = 2;
}

message MembershipLease {
  string resource_id = 1;
  uint64 epoch = 2;
  uint64 expires_at_unix_ms = 3;
}

message HeartbeatRequest {
  string resource_id = 1;
  uint64 epoch = 2;
}

message LeaseWorkRequest {
  string resource_id = 1;
  uint64 epoch = 2;
}

message ObjectRef {
  string object_id = 1;
  uint64 size_bytes = 2;
  string digest = 3;
}

message ExecutionLease {
  string task_id = 1;
  string execution_id = 2;
  string resource_id = 3;
  uint64 resource_epoch = 4;
  uint64 expires_at_unix_ms = 5;
}

message WorkLease {
  ExecutionLease lease = 1;
  string artifact = 2;
  string entrypoint = 3;
  repeated string arguments = 4;
  repeated ObjectRef inputs = 5;
}

message RenewWorkRequest { ExecutionLease lease = 1; }

message CommitTaskRequest {
  ExecutionLease lease = 1;
  repeated ObjectRef outputs = 2;
}

message CommitTaskResponse { bool accepted = 1; }

message ResolveObjectRequest { string object_id = 1; }

message ObjectLocation {
  string transport = 1;
  string endpoint = 2;
  string resource_id = 3;
}

message ResolveObjectResponse {
  ObjectRef object = 1;
  repeated ObjectLocation locations = 2;
}
